<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>问卷完整业务流程图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 5  问卷完整业务流程图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第2章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">01  创建和编辑</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">添加题目，保存草稿</text><polyline points="396,242 455,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,242 444.9560216565646,246.48536498365527 444.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="464" y="145" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="484" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">02  发布检查</text><text x="484" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">题型、跳转、来源均需合法</text><polyline points="816,242 875,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,242 864.9560216565646,246.48536498365527 864.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="884" y="145" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="904" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">03  生成发布快照</text><text x="904" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font