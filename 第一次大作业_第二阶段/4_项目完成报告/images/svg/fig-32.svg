<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>升级预览与确认流程图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 32  升级预览与确认流程图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第9章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">01  保存并选定目标版本</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">发起新预览时作废旧确认</text><polyline points="396,242 455,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,242 444.9560216565646,246.48536498365527 444.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="464" y="145" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="484" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">02  绑定预览上下文</text><text x="484" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">问卷、实例、来源、目标、</text><text x="484" y="255.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">revision、草稿</text><polyline points="816,242 875,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,242 864.9560216565646,246.48536498365527 864.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="884" y="145" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="904" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">03  展示差异与规则问题</text><text x="904" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">待修复项保留，不静默删除</text><polyline points="1060.0,340 1060.0,367 220.0,367 220.0,395" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="220.0,395 215.51463501634473,384.9560216565646 224.48536498365527,384.9560216565646" fill="#8a9aad"/><rect x="44" y="395" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">04  确认前再次核对</text><text x="64" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">上下文变化则重新预览；禁止自</text><text x="64" y="505.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">动保存</text><polyline points="396,492 455,492" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,492 444.9560216565646,496.48536498365524 444.9560216565646,487.51463501634476" fill="#8a9aad"/><rect x="464" y="395" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="484" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">05  后端事务升级</text><text x="484" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">核权、同系列、revision；不改旧</text><text x="484" y="505.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">快照</text><polyline points="816,492 875,492" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,492 864.9560216565646,496.48536498365524 864.9560216565646,487.51463501634476" fill="#8a9aad"/><rect x="884" y="395" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="904" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">06  保存待修复草稿／发布</text><text x="904" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">失败旧预览失效，修复后再完整</text><text x="904" y="505.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">发布</text><polyline points="44,681 1236,681" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="695" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="710.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="695" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="710.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="695" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="710.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="710.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>