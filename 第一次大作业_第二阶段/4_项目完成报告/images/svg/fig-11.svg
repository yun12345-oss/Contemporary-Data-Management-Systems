ont-size="21" font-weight="400" fill="#233448">通常一起读取、校验和发布；问卷题数有上</text><text x="820" y="264.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">限</text><rect x="44" y="292.0" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="328.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">独立题目与内容历史</text><rect x="324" y="292.0" width="480" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="328.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">questions 引用 question_versions</text><rect x="804" y="292.0" width="432" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="328.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不同问卷复用，旧内容不可被新版覆盖</text><rect x="44" y="355.5" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">填写过程与正式答卷</text><rect x="324" y="355.5" width="480" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">独立集合，通过 version_id 引用</text><rect x="804" y="355.5" width="432" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">数量持续增长，避免问卷文档无限膨胀</text><rect x="44" y="419.0" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">题库成员与授权</text><rect x="324" y="419.0" width="480" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" st