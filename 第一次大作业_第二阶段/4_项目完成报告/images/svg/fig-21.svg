<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1135" viewBox="0 0 1280 1135" role="img"><title>自动保存与恢复时序图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 21  自动保存与恢复时序图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第5章 · 问序问卷系统 · 应用 2.0.2</text><rect x="55" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="75" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">填写者／页面</text><polyline points="185,202 185,1048" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="510" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="530" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">后端服务</text><polyline points="640,202 640,1048" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="965" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="985" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">MongoDB</text><polyline points="1095,202 1095,1048" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="50" y="226" width="1180" height="62" rx="12" fill="#f4f7fa" stroke="#d5dfe9" stroke-width="1.5"/><text x="70" y="256.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">01  输入立即留在页面：此时还不能称为已同步</text><rect x="177" y="336" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="357.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">02  停顿、最长等待或切题触发保存，携带 revision</text><polyline points="185,428 640,428" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,428 629.9560216565646,432.48536498365524 629.9560216565646,423.51463501634476" fill="#2967ad"/><rect x="632" y="456" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="646" y="477.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">03  检查状态与 revision，保存原始输入并增加修订</text><text x="646" y="505.5" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">号</text><polyline points="640,548 1095,548" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="1095,548 1084.9560216565646,552.4853649836552 1084.9560216565646,543.5146350163448" fill="#2967ad"/><rect x="177" y="576" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="597.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">04  数据库确认后返回；仅最新修改获确认才显示已</text><text x="191" y="625.5" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">同步</text><polyline points="640,668 185,668" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="185,668 195.04397834343538,663.5146350163448 195.04397834343538,672.4853649836552" fill="#2967ad"/><rect x="177" y="696" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="717.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">05  退出后同账号恢复：请求已有进行中过程</text><polyline points="185,788 640,788" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,788 629.9560216565646,792.4853649836552 629.9560216565646,783.5146350163448" fill="#2967ad"/><rect x="177" y="816" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="837.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">06  按原快照与有效答案重算路径，返回合理位置</text><polyline points="640,908 185,908" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="185,908 195.04397834343538,903.5146350163448 195.04397834343538,912.4853649836552" fill="#2967ad"/><rect x="177" y="936" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="957.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">07  若 revision 冲突则提示处理，不能直接覆盖</text><polyline points="185,1028 640,1028" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,1028 629.9560216565646,1032.4853649836552 629.9560216565646,1023.5146350163448" fill="#2967ad"/><polyline points="44,1076 1236,1076" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="1090" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="1105.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="1090" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="1105.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="1090" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="1105.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="1105.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>