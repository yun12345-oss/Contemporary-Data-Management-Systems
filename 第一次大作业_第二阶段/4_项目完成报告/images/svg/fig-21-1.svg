<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img"><title>恢复填写与只读状态判断</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 21-1  恢复填写与只读状态判断</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第5章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="1192" height="145" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">读取前：核对本人过程与原快照</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不存在／不属于本人 → 404；不支持版本 → 明确错误</text><rect x="44" y="390" width="550" height="165" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="429.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">进行中，并且问卷可写</text><text x="64" y="469.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">重算路径和合理位置，允许保存与提交</text><rect x="686" y="390" width="550" height="165" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="706" y="429.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">关闭、截止或已进入终态</text><text x="706" y="469.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">可读取并标只读；保存／新提交受到限制</text><rect x="44" y="705" width="1192" height="140" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="744.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">已有提交或放弃状态</text><text x="64" y="784.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">提交返回回执；放弃或提交后的草稿输入已清理</text><polyline points="640,290 640,335 319,335 319,390" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="319,390 314.51463501634476,379.9560216565646 323.48536498365524,379.9560216565646" fill="#8a9aad"/><polyline points="640,335 961,335 961,390" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="961,390 956.5146350163448,379.9560216565646 965.4853649836552,379.9560216565646" fill="#8a9aad"/><polyline points="961,555 961,630 640,630 640,705" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="640,705 635.5146350163448,694.9560216565646 644.4853649836552,694.9560216565646" fill="#8a9aad"/><text x="975" y="595.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">若为终态</text><text x="46" y="958.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233448">位置由服务端有效路径约束；关闭只读不等于允许继续写入。</text><polyline points="44,1061 1236,1061" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="1075" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="1090.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="1075" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="1090.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="1075" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="1090.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="1090.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>