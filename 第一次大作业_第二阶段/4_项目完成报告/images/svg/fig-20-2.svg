<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img"><title>必答题是否存在合法答案</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 20-2  必答题是否存在合法答案</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第5章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="1192" height="130" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">先判断配置是否满足结构和上下界要求</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">再检查必答时是否至少有一种合法答案</text><rect x="44" y="385" width="550" height="170" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="424.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">反例一：必答多选</text><text x="64" y="464.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">最多允许 0 项：不选违必答，选了又超限</text><rect x="686" y="385" width="550" height="170" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="706" y="424.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">反例二：必答整数</text><text x="706" y="464.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">范围 0.1～0.9：其中不存在合法整数</text><rect x="44" y="695" width="1192" height="130" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="734.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">拒绝发布并说明原因</text><text x="64" y="774.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">调整配置后重新校验，不能让填写者无解</text><polyline points="640,275 640,325 319,325 319,385" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="319,385 314.51463501634476,374.9560216565646 323.48536498365524,374.9560216565646" fill="#8a9aad"/><polyline points="640,325 961,325 961,385" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="961,385 956.5146350163448,374.9560216565646 965.4853649836552,374.9560216565646" fill="#8a9aad"/><polyline points="319,555 319,625 640,625 640,695" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="640,695 635.5146350163448,684.9560216565646 644.4853649836552,684.9560216565646" fill="#8a9aad"/><polyline points="961,555 961,625 640,625" fill="none" stroke="#8a9aad" stroke-width="2"/><polyline points="44,901 1236,901" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="915" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="930.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="915" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="930.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="915" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="930.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="930.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>