<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img"><title>组合条件怎样逐层判断</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 18-3  组合条件怎样逐层判断</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第4章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="1192" height="120" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">在 Q3 判断：all</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">左侧与右侧两项必须都成立</text><rect x="44" y="365" width="480" height="140" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="404.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">条件 A：Q1 等于 yes</text><text x="64" y="444.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">没有有效答案则不成立</text><rect x="650" y="365" width="586" height="140" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="670" y="404.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">条件 B：any</text><text x="670" y="444.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">下列至少一个子条件成立</text><rect x="650" y="645" width="270" height="140" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="670" y="684.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">子条件 B1</text><text x="670" y="724.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">Q3 学习时间 ≥ 2 小时</text><rect x="950" y="645" width="286" height="140" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="970" y="684.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">子条件 B2</text><text x="970" y="724.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">Q2 所选工具包含 </text><text x="970" y="755.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">MongoDB</text><polyline points="640,265 640,315 284,315 284,365" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="284,365 279.51463501634476,354.9560216565646 288.48536498365524,354.9560216565646" fill="#8a9aad"/><polyline points="640,315 943,315 943,365" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="943,365 938.5146350163448,354.9560216565646 947.4853649836552,354.9560216565646" fill="#8a9aad"/><polyline points="943,505 943,570 785,570 785,645" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="785,645 780.5146350163448,634.9560216565646 789.4853649836552,634.9560216565646" fill="#8a9aad"/><polyline points="943,570 1093,570 1093,645" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="1093,645 1088.5146350163448,634.9560216565646 1097.4853649836552,634.9560216565646" fill="#8a9aad"/><text x="46" y="860.0" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#233448">先计算子条件，再计算 any，最后计算 all；引用只能来自当前题或前题。</text><polyline points="44,891 1236,891" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="905" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="920.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="905" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="920.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="905" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="920.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="920.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>