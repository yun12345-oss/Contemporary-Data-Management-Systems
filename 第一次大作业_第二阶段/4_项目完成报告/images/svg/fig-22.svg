<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>正式提交事务图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 22  正式提交事务图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第5章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">01  请求携带 attempt 与 </text><text x="64" y="220.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">revision</text><text x="64" y="260.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">先检查登录、归属和终态</text><polyline points="396,242 455,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,242 444.9560216565646,246.48536498365527 444.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="464" y="145" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="484" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">02  读取服务端草稿与原快照</text><text x="484" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不接收第二套独立提交答案</text><polyline points="816,242 875,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,242 864.9560216565646,246.48536498365527 864.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="884" y="145" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="904" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">03  重算路径并完整校验</text><text x="904" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">有效路径必答、题型与状态均合</text><text x="904" y="255.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">法</text><polyline points="1060.0,340 1060.0,367 220.0,367 220.0,395" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="220.0,395 215.51463501634473,384.9560216565646 224.48536498365527,384.9560216565646" fill="#8a9aad"/><rect x="44" y="395" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">04  事务写正式答卷并完成过</text><text x="64" y="470.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">程</text><text x="64" y="510.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">关联 response_id，按实现清理</text><text x="64" y="541.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">答案副本</text><polyline points="396,492 455,492" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,492 444.9560216565646,496.48536498365524 444.9560216565646,487.51463501634476" fill="#8a9aad"/><rect x="464" y="395" width="352" height="195" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="484" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">05  返回提交回执</text><text x="484" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">失败回滚；重复请求遵循提交去</text><text x="484" y="505.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">重规则</text><polyline points="44,681 1236,681" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="695" width="18" height="18" rx="3" f