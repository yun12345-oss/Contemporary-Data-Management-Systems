<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="573" viewBox="0 0 1280 573" role="img"><title>使用授权与统计授权关系图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 33  使用授权与统计授权关系图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第9章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="139" width="280" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="60" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">谁授权</text><rect x="324" y="139" width="480" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="340" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">资源与能力</text><rect x="804" y="139" width="432" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="820" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">明确边界</text><rect x="44" y="197" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">题目所有者</text><rect x="324" y="197" width="480" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">use：指定题目版本 → 接收者</text><rect x="804" y="197" width="432" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">允许新增导入；未来版本不自动授权</text><rect x="44" y="260.5" width="280" height="95.0" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">问卷所有者</text><rect x="324" y="260.5" width="480" height="95.0" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">aggregate：指定问卷＋题目版本 → 接收者</text><rect x="804" y="260.5" width="432" height="95.0" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">允许指定范围汇总；不提供原始答卷或文本</text><text x="820" y="328.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">明细</text><rect x="44" y="355.5" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">题目作者查看他人数据</text><rect x="324" y="355.5" width="480" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">必须获得相应问卷的统计授权</text><rect x="804" y="355.5" width="432" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不能因为拥有题目就给自己授权他人答案</text><rect x="44" y="419.0" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">共享接收者管理题库</text><rect x="324" y="419.0" width="480" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">可整理自己可用的版本</text><rect x="804" y="419.0" width="432" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">题库管理权不等于派生和转授权</text><polyline points="44,514 1236,514" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="528" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="528" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="528" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="543.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>