<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1015" viewBox="0 0 1280 1015" role="img"><title>导入与撤销并发时序图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 29  导入与撤销并发时序图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第8章 · 问序问卷系统 · 应用 2.0.2</text><rect x="55" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="75" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">导入事务</text><polyline points="185,202 185,928" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="510" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="530" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">共同协调记录</text><polyline points="640,202 640,928" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="965" y="138" width="260" height="58" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="985" y="172.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#233448">撤销操作</text><polyline points="1095,202 1095,928" fill="none" stroke="#8a9aad" stroke-width="2" stroke-dasharray="6 5"/><rect x="177" y="216" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="237.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">01  情形一：核权并条件写 activity_seq，导入事务</text><text x="191" y="265.5" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">先提交</text><polyline points="185,308 640,308" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,308 629.9560216565646,312.48536498365524 629.9560216565646,303.51463501634476" fill="#2967ad"/><rect x="632" y="336" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="646" y="357.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">02  随后撤销提交：阻止后续新增导入</text><polyline points="1095,428 640,428" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,428 650.0439783434354,423.51463501634476 650.0439783434354,432.48536498365524" fill="#2967ad"/><rect x="177" y="456" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="477.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">03  已合法导入的原实例保留</text><polyline points="640,548 185,548" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="185,548 195.04397834343538,543.5146350163448 195.04397834343538,552.4853649836552" fill="#2967ad"/><rect x="632" y="576" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="646" y="597.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">04  情形二：撤销先提交，授权变为无效</text><polyline points="1095,668 640,668" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,668 650.0439783434354,663.5146350163448 650.0439783434354,672.4853649836552" fill="#2967ad"/><rect x="177" y="696" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="717.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">05  在途导入若冲突重试，必须重新检查授权</text><polyline points="185,788 640,788" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="640,788 629.9560216565646,792.4853649836552 629.9560216565646,783.5146350163448" fill="#2967ad"/><rect x="177" y="816" width="471" height="78" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="191" y="837.0" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="400" fill="#233448">06  授权无效则拒绝导入，不产生合法实例</text><polyline points="640,908 185,908" fill="none" stroke="#2967ad" stroke-width="2"/><polygon points="185,908 195.04397834343538,903.5146350163448 195.04397834343538,912.4853649836552" fill="#2967ad"/><polyline points="44,956 1236,956" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="970" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="985.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="970" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="985.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="970" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="985.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="985.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>