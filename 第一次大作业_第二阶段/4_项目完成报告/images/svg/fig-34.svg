<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="637" viewBox="0 0 1280 637" role="img"><title>撤销授权前后行为图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 34  撤销授权前后行为图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第9章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="139" width="280" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="60" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">操作或对象</text><rect x="324" y="139" width="480" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="340" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">撤销前</text><rect x="804" y="139" width="432" height="58" rx="0" fill="#233e60" stroke="#ffffff" stroke-width="1.5"/><text x="820" y="174.0" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#ffffff">撤销后</text><rect x="44" y="197" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">已合法导入的原草稿实例</text><rect x="324" y="197" width="480" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">按原来源保存、修复和发布</text><rect x="804" y="197" width="432" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="233.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">保留原版本，可继续保存和发布</text><rect x="44" y="260.5" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">已发布快照／旧填写过程</text><rect x="324" y="260.5" width="480" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">固定内容、绑定发布版本</text><rect x="804" y="260.5" width="432" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="296.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">继续可用，不追随授权删除内容</text><rect x="44" y="324.0" width="280" height="95.0" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="360.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">新增导入／升级为其他版</text><text x="60" y="391.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">本</text><rect x="324" y="324.0" width="480" height="95.0" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="360.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">检查目标当前授权</text><rect x="804" y="324.0" width="432" height="95.0" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="360.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">原授权不可复用；目标须有有效授权</text><rect x="44" y="419.0" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">汇总统计授权</text><rect x="324" y="419.0" width="480" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">按指定范围查询</text><rect x="804" y="419.0" width="432" height="63.5" rx="0" fill="#ffffff" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="455.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">新请求排除已撤销的问卷范围</text><rect x="44" y="482.5" width="280" height="63.5" rx="0" fill="#edf4fc" stroke="#d5dfe9" stroke-width="1.5"/><text x="60" y="518.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#233448">再次另存或转授共享题</text><rect x="324" y="482.5" width="480" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="340" y="518.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不默认允许</text><rect x="804" y="482.5" width="432" height="63.5" rx="0" fill="#f6f8fb" stroke="#d5dfe9" stroke-width="1.5"/><text x="820" y="518.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">撤销不会使它变成自己的题</text><polyline points="44,578 1236,578" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="592" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="607.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="592" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="607.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="592" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="607.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="607.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>