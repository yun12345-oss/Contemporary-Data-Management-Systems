<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img"><title>规则匹配与默认目标决策</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 18-4  规则匹配与默认目标决策</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第4章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="660" height="150" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">按顺序取下一条规则</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">还有规则吗？</text><rect x="44" y="400" width="660" height="150" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="439.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">当前条件成立吗？</text><text x="64" y="479.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">否：继续下一条</text><rect x="884" y="400" width="352" height="170" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="904" y="439.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">是：采用本条 target</text><text x="904" y="479.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">后续题或 END；仅默认目标可为</text><text x="904" y="510.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">空</text><polyline points="704,475 884,475" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="884,475 873.9560216565646,479.48536498365524 873.9560216565646,470.51463501634476" fill="#8a9aad"/><text x="806.0" y="471.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">是</text><rect x="44" y="655" width="660" height="150" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="64" y="694.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">全部规则均未命中</text><text x="64" y="734.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">检查 default_target</text><rect x="884" y="655" width="352" height="170" rx="12" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="904" y="694.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">采用默认目标或顺序下一题</text><text x="904" y="734.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">后续题或 END；仅默认目标可为</text><text x="904" y="765.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">空</text><polyline points="704,730 884,730" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="884,730 873.9560216565646,734.4853649836552 873.9560216565646,725.5146350163448" fill="#8a9aad"/><polyline points="374,295 374,400" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="374,400 369.51463501634476,389.9560216565646 378.48536498365524,389.9560216565646" fill="#8a9aad"/><text x="386.0" y="343.5" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">有规则</text><polyline points="44,475 20,475 20,205 44,205" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="44,205 33.95602165656461,209.48536498365527 33.95602165656461,200.51463501634473" fill="#8a9aad"/><text x="47" y="352.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">不成立则继续循环</text><polyline points="704,220 805,220 805,610 374,610 374,655" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="374,655 369.51463501634476,644.9560216565646 378.48536498365524,644.9560216565646" fill="#8a9aad"/><text x="814" y="356.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">无规则</text><text x="46" y="970.0" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#233448">第一条命中后立即停止；规则目标需非空，默认目标 null 表示顺序继续。</text><polyline points="44,1011 1236,1011" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="1025" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="1025" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="1025" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>