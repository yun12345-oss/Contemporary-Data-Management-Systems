<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img"><title>统计参数与授权范围校验</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 22-2  统计参数与授权范围校验</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第5章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="352" height="195" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">01  参数合法</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">时区、起止顺序、安全递增边界</text><polyline points="396,242 455,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,242 444.9560216565646,246.48536498365527 444.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="464" y="145" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="484" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">02  确定问卷范围</text><text x="484" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">自有或有效 aggregate 授权</text><polyline points="816,242 875,242" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,242 864.9560216565646,246.48536498365527 864.9560216565646,237.51463501634473" fill="#8a9aad"/><rect x="884" y="145" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="904" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">03  确定版本与时间</text><text x="904" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">快照来源和正式 submitted_at</text><polyline points="1060.0,340 1060.0,367 220.0,367 220.0,395" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="220.0,395 215.51463501634473,384.9560216565646 224.48536498365527,384.9560216565646" fill="#8a9aad"/><rect x="44" y="395" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="64" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">04  匹配有效答案</text><text x="64" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不按题干猜来源，不混合版本</text><polyline points="396,492 455,492" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="455,492 444.9560216565646,496.48536498365524 444.9560216565646,487.51463501634476" fill="#8a9aad"/><rect x="464" y="395" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="484" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">05  分别计数</text><text x="484" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">答卷按 ID，作答按实例</text><polyline points="816,492 875,492" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="875,492 864.9560216565646,496.48536498365524 864.9560216565646,487.51463501634476" fill="#8a9aad"/><rect x="884" y="395" width="352" height="195" rx="12" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="904" y="434.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">06  只返回允许汇总</text><text x="904" y="474.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">不输出跨卷去重人数或文本原文</text><polyline points="44,681 1236,681" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="695" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text