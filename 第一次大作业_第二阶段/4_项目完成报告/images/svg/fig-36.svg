<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img"><title>数据库显式升级与恢复流程图</title><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2967ad" stroke="#2967ad" stroke-width="1.5"/><text x="44" y="59.0" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#233448">图 36  数据库显式升级与恢复流程图</text><text x="46" y="103.0" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#607083">第9章 · 问序问卷系统 · 应用 2.0.2</text><rect x="44" y="145" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">1. 维护前备份与 --check</text><text x="64" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">已知约束、全量文档预检</text><rect x="464" y="145" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="484" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">2. --apply 保存日志</text><text x="484" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">数据库、原约束、目标与进度</text><rect x="884" y="145" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="904" y="184.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">3. 逐集合应用</text><text x="904" y="224.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">每次应用后记录进度</text><rect x="884" y="425" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="904" y="464.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">完成</text><text x="904" y="504.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">日志状态为 complete</text><rect x="464" y="425" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="484" y="464.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">恢复前检查保护条件</text><text x="484" y="504.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">日志匹配；约束未被他人改变</text><rect x="44" y="715" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="64" y="754.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">允许按日志恢复</text><text x="64" y="794.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">满足保护条件，恢复原约束</text><rect x="464" y="715" width="352" height="175" rx="12" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="484" y="754.0" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#233448">拒绝仅恢复旧约束</text><text x="484" y="794.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">已有新业务数据时需完整备份恢</text><text x="484" y="825.5" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">复</text><polyline points="396,232 464,232" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="464,232 453.9560216565646,236.48536498365527 453.9560216565646,227.51463501634473" fill="#8a9aad"/><polyline points="816,232 884,232" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="884,232 873.9560216565646,236.48536498365527 873.9560216565646,227.51463501634473" fill="#8a9aad"/><polyline points="1060,320 1060,425" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="1060,425 1055.5146350163448,414.9560216565646 1064.4853649836552,414.9560216565646" fill="#8a9aad"/><text x="1080" y="372.0" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#233448">成功</text><polyline points="1060,320 1060,369 640,369 640,425" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="640,425 635.5146350163448,414.9560216565646 644.4853649836552,414.9560216565646" fill="#8a9aad"/><text x="666" y="354.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">失败尝试恢复／显式 --rollback</text><polyline points="640,600 640,715" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="640,715 635.5146350163448,704.9560216565646 644.4853649836552,704.9560216565646" fill="#8a9aad"/><text x="660" y="665.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">不满足条件</text><polyline points="640,600 640,649 220,649 220,715" fill="none" stroke="#8a9aad" stroke-width="2"/><polygon points="220,715 215.51463501634473,704.9560216565646 224.48536498365527,704.9560216565646" fill="#8a9aad"/><text x="248" y="634.0" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#233448">满足条件</text><text x="46" y="964.0" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#233448">普通启动另走检查与缺失集合初始化；不会自动覆盖已有校验器。</text><polyline points="44,1011 1236,1011" fill="none" stroke="#8a9aad" stroke-width="2"/><rect x="46" y="1025" width="18" height="18" rx="3" fill="#eef1f5" stroke="#64748b" stroke-width="1.5"/><text x="74" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">沿用结构</text><rect x="250" y="1025" width="18" height="18" rx="3" fill="#eaf3ff" stroke="#2967ad" stroke-width="1.5"/><text x="278" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">新增能力</text><rect x="454" y="1025" width="18" height="18" rx="3" fill="#fff3e5" stroke="#b96b13" stroke-width="1.5"/><text x="482" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">修改／扩展</text><text x="840" y="1040.0" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#607083">设计示意；依据见图后说明</text></svg>